name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Tentukan versi
        id: ver
        run: |
          # Versi dasar dari android/app/build.gradle + nomor build, mis. 1.1.7
          BASE=$(grep -oP 'appVersionName.*?"\K[0-9.]+' android/app/build.gradle)
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - run: npm ci && npx cap sync android

      # Kunci release yang tetap wajib, kalau tidak Android menolak update ("paket bentrok").
      # Isi secret dengan: powershell -File scripts\set-github-secrets.ps1
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 kosong. Jalankan scripts/set-github-secrets.ps1 lalu ulangi workflow."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore/keystore.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="${{ steps.ver.outputs.version }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk ../PC-Remote.apk

      # Release ini yang dibaca README dan tombol "Update sekarang" di aplikasi.
      - name: Buat release & summary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" PC-Remote.apk --latest --target "$GITHUB_SHA" \
            --title "PC Remote v$VERSION" \
            --notes "Build dari commit ${GITHUB_SHA::7}: ${COMMIT_MSG:-manual run}"
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/PC-Remote.apk"
          {
            echo "## 📱 PC Remote v$VERSION"
            echo "### [⬇️ Download PC-Remote.apk]($URL)"
            echo "Commit \`${GITHUB_SHA::7}\` — ${COMMIT_MSG%%$'\n'*}"
          } >> "$GITHUB_STEP_SUMMARY"
